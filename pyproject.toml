[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morph"
version = "0.1.0"
description = "MORPH: cross-morphology motion retargeting toolkit"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "PyYAML>=6.0",
  "torch>=2.2",
  "mujoco>=3.1",
  "pytorch-kinematics>=0.7",
  "wandb>=0.16",
  "tensorboard>=2.14",
  "protobuf>=3.20,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
