model_name: teacher_pan
architecture: pan
use_vae: false
architecture_name: pan
batch_size: 64
epoch_num: 3001
epoch_begin: 0
save_iter: 200
print_iter: 10
optimizer: Adam
lr_g: 0.0001
lr_d: 0.0001
dis_mode: denorm_rotation
quat_loss_type: geodesic
retar_vel_matching: direct
rec_loss_type: norm_rec

# Root angular feature layout is inferred from processed stats; yaw is legacy.
root_ang_features: yaw
root_ang_dim: 1
lambda_retar_roll_rate: 0.0
lambda_retar_pitch_rate: 0.0
lambda_retar_yaw_rate: -1.0  # <0 preserves legacy 0.1 * lambda_retar_vel behavior

# Cycle losses are separated. Negative fk/latent values fall back to lambda_cycle.
lambda_cycle_fk: -1.0
lambda_cycle_latent: -1.0
lambda_cycle_motion: 0.0
